<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Clarity Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
<main class="auth"><div class="card auth-card">
<div class="auth-brand"><span class="brand-logo"><i class="fa-solid fa-wallet" aria-hidden="true"></i></span><strong>Clarity Finance</strong></div>
<h1>Welcome back</h1><p class="muted">Log in to manage your finances.</p>
<div class="alert alert-error" id="login-error" role="alert" hidden style="margin-top:16px"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>Incorrect email or password. Try again.</span></div>
<form id="login-form" novalidate>
<div class="field"><label for="l-email">Email <span class="req" aria-hidden="true">*</span></label><input id="l-email" name="email" type="email" required data-error="Please enter your email." autocomplete="email"><p class="error-text" role="alert"></p></div>
<div class="field"><label for="l-password">Password <span class="req" aria-hidden="true">*</span></label><div class="password-wrap"><input id="l-password" name="password" type="password" required data-error="Please enter your password." autocomplete="current-password"><button type="button" class="eye" data-toggle-password aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div><p class="error-text" role="alert"></p></div>
<div class="row-between"><label class="check"><input type="checkbox" name="remember"> Remember me</label><a href="forgot-password.html">Forgot password?</a></div>
<button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
<p class="auth-foot">Don't have an account? <a href="register.html">Register</a></p>
<p class="auth-foot small">Demo: use any valid email and a password with 6+ characters.</p>
</div></main>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
