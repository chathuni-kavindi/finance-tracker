<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | Clarity Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
<main class="auth"><div class="card auth-card">
<div class="auth-brand"><span class="brand-logo"><i class="fa-solid fa-wallet" aria-hidden="true"></i></span><strong>Clarity Finance</strong></div>
<h1>Forgot your password?</h1><p class="muted">Enter your email and we'll send reset instructions if an account exists.</p>
<form id="forgot-form" novalidate><div class="field"><label for="f-email">Email <span class="req" aria-hidden="true">*</span></label><input id="f-email" name="email" type="email" required data-error="Please enter your email."><p class="error-text" role="alert"></p></div><button class="btn btn-primary btn-block" type="submit">Send reset link</button></form>
<div class="alert alert-success" id="forgot-sent" role="status" hidden style="margin-top:20px"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>Check your email. If an account exists for this address, you'll receive reset instructions shortly.</span></div>
<p class="auth-foot"><a href="login.html">Back to login</a></p>
</div></main>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
